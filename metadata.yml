snapshots: https://github.com/OpenTermsArchive/sante-numerique-france-snapshots
languages:
  - fr
jurisdictions:
  - FR
trackingPeriods:
  - startDate: '2025-07-17'
    schedule: 30 */12 * * *
    serverLocation: Strasbourg, FR
governance:
  Open Terms Archive:
    url: https://opentermsarchive.org
    logo: https://opentermsarchive.org/images/logo/logo-open-terms-archive-black.png
    roles: [sysadmin, maintainer]
  Délégation au numérique en santé:
    url: https://sante.gouv.fr/
    logo: https://opentermsarchive.org/images/contributors/ministere-sante.png
    roles: [analyst, curator]
i18n:
  fr: 
    tagline: Services numériques en santé utilisés en France
