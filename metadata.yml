id: sante-numerique-france
name: Numérique en santé France
tagline: Digital health services used in France
description: The “Numérique en santé France” collection is dedicated to monitoring the conditions of use of digital health services used in France, particularly when they are listed in the Mon espace santé service catalog.
dataset: https://github.com/OpenTermsArchive/sante-numerique-france-versions/releases
